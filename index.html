<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valor que o João deve para o Bruno</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            background-image: url('barros.png');
            background-repeat: repeat;
            background-size: 120px 120px; 
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-top: 40px;
        }

        #contador-container {
            display: inline-block;
            padding: 30px;
            border: 3px solid #333;
            background-color: #fff;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        #contador {
            font-size: 2.5em;
            color: #444;
            margin: 20px 0;
        }

        #descricao {
            font-size: 1em;
            color: #666;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            #contador-container {
                padding: 20px;
            }

            #contador {
                font-size: 2em;
            }

            #descricao {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <h1>Valor que o João deve para o Bruno</h1>

    <div id="contador-container">
        <div id="contador">R$ 0,00</div>
        <div id="descricao">Contando desde 01/01/2025</div>
    </div>

    <script>
        const inicio = new Date("2025-01-01T00:00:00");

        function atualizarContador() {
            const agora = new Date();
            const diferencaSegundos = Math.floor((agora - inicio) / 1000);
            const valorAtual = (diferencaSegundos * 0.01).toFixed(2).replace('.', ',');
            document.getElementById("contador").textContent = `R$ ${valorAtual}`;
        }

        setInterval(atualizarContador, 1000);
    </script>
</body>
</html>
